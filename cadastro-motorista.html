<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>Porto Mobi | Cadastro do Motorista</title>
<style>
:root{color-scheme:dark;--gold:#e9b83e;--border:#a9812e;--text:#fff;--muted:#d8c9aa}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -25%,#3b290e,#090807 42%,#020202 85%);color:var(--text);font:16px/1.5 Tahoma,Geneva,sans-serif}
main{max-width:820px;margin:auto;padding:18px 12px 55px}
header{text-align:center;padding:16px 0 23px}h1{color:var(--gold);font-size:29px;letter-spacing:2px;margin:0}header p{color:var(--gold);margin:2px 0 12px;letter-spacing:1px}h2{font-size:22px;margin:0 0 18px}
.card{background:linear-gradient(150deg,#1b160e,#080706);border:1px solid var(--border);border-radius:17px;padding:22px;box-shadow:0 8px 28px #0008}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.wide{grid-column:1/-1}
label{font-weight:700}input,output{width:100%;min-height:49px;border:1px solid #957632;border-radius:9px;background:#171510;color:#fff;padding:12px;font:inherit}output{display:block;color:#f4cf70}input:focus{outline:2px solid var(--gold);outline-offset:1px}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}.buttons{display:flex;gap:12px;margin-top:23px}button,.link{border:0;border-radius:10px;padding:14px 17px;font:bold 16px Tahoma,sans-serif;cursor:pointer;text-align:center;text-decoration:none}button{flex:1;background:linear-gradient(100deg,#ffe27b,#d6a323);color:#171100}button:disabled{opacity:.55;cursor:not-allowed}.link{display:block;background:#242017;border:1px solid var(--border);color:var(--gold);margin-top:14px}
.notice{margin-top:18px;border:1px solid var(--border);border-radius:10px;padding:14px;background:#292112}.notice.success{background:#10291b;border-color:#4eae79}.notice.error{background:#311716;border-color:#e17670}
footer{text-align:center;color:#a99c81;font-size:12px;padding:18px}
@media(max-width:580px){.card{padding:15px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.buttons{flex-direction:column}}
</style>
</head>
<body>
<main>
<header><h1>PORTO MOBI</h1><p>TRANSPORTE EXECUTIVO</p><strong>CADASTRO DO MOTORISTA</strong></header>
<section class="card">
<h2>Dados do Motorista</h2>
<form id="form" autocomplete="on">
<div class="grid">
<div class="field"><label for="codigo">Código do Motorista</label><output id="codigo">PMM-000</output></div>
<div class="field"><label for="dataCadastro">Data do Cadastro</label><output id="dataCadastro">—</output></div>
<div class="field"><label for="horaCadastro">Hora do Cadastro</label><output id="horaCadastro">—</output></div>
<div class="field wide"><label for="nome">Nome do Motorista *</label><input id="nome" name="name" autocomplete="name" maxlength="120" required placeholder="Nome completo"></div>
<div class="field"><label for="telefone">Telefone do Motorista *</label><input id="telefone" name="tel" type="tel" autocomplete="tel" inputmode="tel" maxlength="20" required placeholder="(51) 99999-9999"></div>
<div class="field"><label for="email">E-mail do Motorista — Login *</label><input id="email" name="email" type="email" autocomplete="email" maxlength="150" required placeholder="motorista@email.com"></div>
<div class="field"><label for="senha">Senha — mínimo 8 caracteres *</label><input id="senha" type="password" autocomplete="new-password" minlength="8" required></div>
<div class="field"><label for="confirmar">Confirmar Senha *</label><input id="confirmar" type="password" autocomplete="new-password" minlength="8" required></div>
<div class="field wide"><label for="veiculo">Veículo — Marca e Modelo *</label><input id="veiculo" maxlength="100" required placeholder="Ex.: Toyota Corolla"></div>
<div class="field"><label for="placa">Placa *</label><input id="placa" maxlength="7" minlength="7" required pattern="[A-Za-z]{3}[0-9][A-Za-z0-9][0-9]{2}" placeholder="ABC1D23" autocapitalize="characters"></div>
<div class="field"><label for="cor">Cor *</label><input id="cor" maxlength="40" required placeholder="Ex.: Preto"></div>
</div>
<p class="hint">* Campos obrigatórios. O cadastro ficará pendente de aprovação pelo administrador.</p>
<div class="buttons"><button id="salvar" type="submit">Cadastrar Motorista</button></div>
<div id="aviso" class="notice" role="status" aria-live="polite" hidden></div>
</form>
</section>
<a class="link" href="./login.html">Voltar para o Login</a>
<footer>Porto Mobi Transporte Executivo</footer>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
'use strict';
const firebaseConfig={apiKey:'AIzaSyAGCmm6FmyPHrjsWEb4jqPXH32N7y7HLDU',authDomain:'porto-mobi---executivo.firebaseapp.com',projectId:'porto-mobi---executivo',storageBucket:'porto-mobi---executivo.firebasestorage.app',messagingSenderId:'1017797508653',appId:'1:1017797508653:web:9610c1775fd966108302a4'};
const $=id=>document.getElementById(id);
let auth,db,busy=false,complete=false;
const dateFmt=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric'});
const timeFmt=new Intl.DateTimeFormat('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit',hour12:false});
function show(text,type=''){const e=$('aviso');e.textContent=text;e.className='notice '+type;e.hidden=!text;}
function clock(){if(complete)return;const now=new Date();$('dataCadastro').textContent=dateFmt.format(now);$('horaCadastro').textContent=timeFmt.format(now);}
clock();setInterval(clock,30000);
function errorMessage(e){if(e.code==='auth/email-already-in-use')return 'Este e-mail já está cadastrado. Use outro e-mail ou entre na conta existente.';if(e.code==='auth/weak-password')return 'A senha não atende aos requisitos de segurança.';if(e.code==='permission-denied')return 'O Firebase bloqueou a gravação. O administrador precisa configurar as regras de acesso da coleção motoristas e do contador.';if(e.code==='auth/network-request-failed')return 'Falha de conexão. Verifique a internet.';return 'Não foi possível concluir o cadastro: '+(e.message||e.code||'erro desconhecido');}
try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();}catch(e){show('Erro ao iniciar o Firebase: '+e.message,'error');$('salvar').disabled=true;}
async function saveDriver(user,values){
  // A transação gera um código sequencial e impede duplicação entre cadastros simultâneos.
  // As regras do Firestore devem autorizar esta operação para o próprio usuário.
  const counter=db.collection('contadores').doc('motoristas');
  const driver=db.collection('motoristas').doc(user.uid);
  const result=await db.runTransaction(async tx=>{
    const [existing,current]=await Promise.all([tx.get(driver),tx.get(counter)]);
    if(existing.exists)return {code:existing.data().codigo,already:true};
    const next=(Number(current.exists?current.data().ultimo:0)||0)+1;
    if(next>999)throw new Error('Limite de códigos PMM-999 atingido. O administrador precisa ampliar a numeração.');
    const code='PMM-'+String(next).padStart(3,'0');
    tx.set(counter,{ultimo:next,atualizadoEm:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
    tx.set(driver,{
      auth_uid:user.uid,uid:user.uid,codigo:code,nome:values.nome,telefone:values.telefone,
      email:user.email||values.email,veiculo:values.veiculo,marcaModelo:values.veiculo,
      placa:values.placa,cor:values.cor,situacao:'Pendente',status:'Pendente',
      origem:'autocadastro',dataCadastro:firebase.firestore.FieldValue.serverTimestamp()
    });
    return {code,already:false};
  });
  return result;
}
$('form').addEventListener('submit',async event=>{
  event.preventDefault();if(busy||complete||!auth||!db)return;
  const form=$('form');if(!form.reportValidity())return;
  const senha=$('senha').value,confirmar=$('confirmar').value;
  if(senha.length<8||confirmar.length<8){show('A senha e a confirmação precisam ter no mínimo 8 caracteres.','error');return;}
  if(senha!==confirmar){show('As senhas não coincidem.','error');return;}
  const values={nome:$('nome').value.trim(),telefone:$('telefone').value.trim(),email:$('email').value.trim().toLowerCase(),veiculo:$('veiculo').value.trim(),placa:$('placa').value.trim().toUpperCase(),cor:$('cor').value.trim()};
  if(!values.nome||!values.telefone||!values.veiculo||!values.cor||!/^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$/.test(values.placa)){show('Confira os dados obrigatórios e a placa do veículo.','error');return;}
  busy=true;$('salvar').disabled=true;show('Criando conta e registrando o motorista...');
  try{
    await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
    let user=auth.currentUser;
    if(!user||user.email?.toLowerCase()!==values.email){
      if(user)await auth.signOut();
      const credential=await auth.createUserWithEmailAndPassword(values.email,senha);
      user=credential.user;
    }
    const saved=await saveDriver(user,values);
    complete=true;$('codigo').textContent=saved.code;
    $('senha').value='';$('confirmar').value='';
    // O registro de data/hora é feito no servidor; a tela mostra a prévia local.
    try{const doc=await db.collection('motoristas').doc(user.uid).get({source:'server'});const stamp=doc.data()?.dataCadastro;if(stamp?.toDate){$('dataCadastro').textContent=dateFmt.format(stamp.toDate());$('horaCadastro').textContent=timeFmt.format(stamp.toDate());}}catch(_){}
    show('Cadastro '+saved.code+' registrado com sucesso! Situação: Pendente. Aguarde a aprovação do administrador.','success');
    for(const input of form.querySelectorAll('input'))input.disabled=true;
    await auth.signOut();
  }catch(e){show(errorMessage(e)+' Se a conta foi criada mas o registro falhou, entre em contato com o administrador antes de tentar novamente.','error');}
  finally{busy=false;$('salvar').disabled=complete;}
});
</script>
</body>
</html>
