<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Porto Mobi | Login do Motorista</title>
<style>:root{color-scheme:dark;--gold:#e9b83e;--border:#a9812e}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#39270d,#090807 45%,#020202 85%);color:white;font:16px/1.5 Tahoma,sans-serif}main{max-width:650px;margin:auto;padding:20px 14px}header{text-align:center;padding:30px 0;color:var(--gold)}header h1{letter-spacing:3px}.card{background:#130f0a;border:1px solid var(--border);border-radius:18px;padding:25px}label{display:block;font-weight:bold;margin:16px 0 7px}input{width:100%;padding:15px;border:1px solid var(--border);border-radius:10px;background:#191713;color:white;font:inherit}button,a{display:block;width:100%;padding:15px;margin-top:18px;text-align:center;border-radius:10px;font:bold 16px Tahoma,sans-serif;text-decoration:none;cursor:pointer}button{background:linear-gradient(90deg,#ffe27b,#d6a323);border:0;color:#171100}a,.secondary{background:#242017;color:var(--gold);border:1px solid var(--border)}button:disabled{opacity:.6}#aviso{padding:15px;margin-top:15px;border:1px solid var(--border);border-radius:10px}footer{text-align:center;color:#b3a68a;font-size:12px;margin-top:25px}</style></head>
<body><main><header><h1>PORTO MOBI</h1><p>TRANSPORTE EXECUTIVO</p><strong>LOGIN DO MOTORISTA</strong></header><section class="card"><h2>Acesso do Motorista</h2><form id="form"><label for="email">E-mail do Motorista</label><input id="email" type="email" autocomplete="username" required><label for="senha">Senha</label><input id="senha" type="password" minlength="8" autocomplete="current-password" required><button id="entrar" type="submit">Entrar</button></form><button id="recuperar" class="secondary" type="button">Esqueci minha senha</button><div id="aviso" role="status" aria-live="polite" hidden></div></section><a href="./cadastro-motorista.html">Cadastrar novo motorista</a><footer>Porto Mobi Transporte Executivo</footer></main>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
'use strict';
const firebaseConfig={apiKey:'AIzaSyAGCmm6FmyPHrjsWEb4jqPXH32N7y7HLDU',authDomain:'porto-mobi---executivo.firebaseapp.com',projectId:'porto-mobi---executivo',storageBucket:'porto-mobi---executivo.firebasestorage.app',messagingSenderId:'1017797508653',appId:'1:1017797508653:web:9610c1775fd966108302a4'};
const $=id=>document.getElementById(id);
let auth,db;
function aviso(s){$('aviso').textContent=s;$('aviso').hidden=!s;}
function erro(e){return ['auth/invalid-credential','auth/user-not-found','auth/wrong-password'].includes(e.code)?'E-mail ou senha inválidos.':e.code==='permission-denied'?'Permissão negada no Firebase. Verifique as regras da coleção motoristas.':e.code==='auth/network-request-failed'?'Falha de conexão.':(e.message||e.code||'Erro inesperado.');}
try{firebase.initializeApp(firebaseConfig);auth=firebase.auth();db=firebase.firestore();}catch(e){aviso('Falha ao iniciar Firebase: '+e.message);$('entrar').disabled=true;}
$('form').addEventListener('submit',async event=>{
 event.preventDefault();if(!auth||!db)return;
 const email=$('email').value.trim().toLowerCase(),senha=$('senha').value;
 $('entrar').disabled=true;aviso('Verificando acesso...');
 try{
  await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
  const cred=await auth.signInWithEmailAndPassword(email,senha);
  const doc=await db.collection('motoristas').doc(cred.user.uid).get({source:'server'});
  if(!doc.exists){await auth.signOut();aviso('Esta conta não possui cadastro de motorista.');return;}
  const m=doc.data(),situacao=String(m.situacao||m.status||'Pendente').trim().toLowerCase();
  if(!['aprovado','ativo'].includes(situacao)){await auth.signOut();aviso('Cadastro ainda não liberado pelo administrador. Situação: '+(m.situacao||m.status||'Pendente'));return;}
  aviso('Acesso autorizado. Abrindo atendimentos...');
  location.assign('./atendimentos-motorista.html');
 }catch(e){aviso(erro(e));}
 finally{$('entrar').disabled=false;$('senha').value='';}
});
$('recuperar').addEventListener('click',async()=>{
 const email=$('email').value.trim();if(!email){aviso('Digite seu e-mail para recuperar a senha.');return;}
 try{await auth.sendPasswordResetEmail(email);aviso('Se a conta existir, você receberá um e-mail para redefinir sua senha.');}
 catch(e){aviso(erro(e));}
});
</script></body></html>
