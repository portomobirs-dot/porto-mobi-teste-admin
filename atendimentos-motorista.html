<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Porto Mobi | Atendimentos a Realizar</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(#35250e,#080705 45%);color:white;font:16px Tahoma,sans-serif;min-height:100vh}main{max-width:850px;margin:auto;padding:18px}header{text-align:center;color:#e9b83e;padding:18px}.card{background:#110e0a;border:1px solid #a9812e;border-radius:16px;padding:20px;margin:16px 0}button,a{background:#e9b83e;color:#171100;padding:12px 18px;border:0;border-radius:9px;font-weight:bold;cursor:pointer;text-decoration:none;display:inline-block;margin:5px}.item{border:1px solid #a9812e;border-radius:10px;padding:12px;margin:12px 0}#msg{line-height:1.5}</style></head><body><main><header><h1>PORTO MOBI</h1><p>TRANSPORTE EXECUTIVO</p></header><section class="card"><h2>Atendimentos a Realizar</h2><p>Atendimentos vinculados ao motorista autenticado.</p><p id="msg" role="status">Verificando acesso...</p><div id="lista"></div><button id="recarregar" type="button">Atualizar</button><a href="./cadastro-motorista.html">Voltar</a></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script>firebase.initializeApp({apiKey:'AIzaSyAGCmm6FmyPHrjsWEb4jqPXH32N7y7HLDU',authDomain:'porto-mobi---executivo.firebaseapp.com',projectId:'porto-mobi---executivo',storageBucket:'porto-mobi---executivo.firebasestorage.app',messagingSenderId:'1017797508653',appId:'1:1017797508653:web:9610c1775fd966108302a4'});const auth=firebase.auth(),db=firebase.firestore(),msg=document.getElementById('msg'),lista=document.getElementById('lista'),estados=['Confirmado', 'Agendado', 'Em andamento', 'Em Andamento', 'Atribuído', 'Atribuido'];function linha(el,rotulo,valor){const p=document.createElement('p');const b=document.createElement('strong');b.textContent=rotulo+': ';p.append(b,document.createTextNode(String(valor||'Não informado')));el.append(p)}async function carregar(){lista.replaceChildren();const u=auth.currentUser;if(!u){msg.textContent='Faça login como motorista para consultar seus atendimentos. Esta página não realiza login.';return}msg.textContent='Consultando atendimentos...';try{const cadastro=await db.collection('motoristas').doc(u.uid).get();if(!cadastro.exists){msg.textContent='Cadastro de motorista não encontrado.';return}const m=cadastro.data();if(!['Aprovado','Ativo'].includes(m.situacao||m.status)){msg.textContent='Seu cadastro precisa ser aprovado pelo administrador.';return}const snap=await db.collection('reservas').where('motoristaUid','==',u.uid).get();const docs=snap.docs.filter(d=>estados.includes(d.data().status||d.data().situacao));msg.textContent=docs.length?docs.length+' atendimento(s) encontrado(s).':'Nenhum atendimento disponível nesta categoria.';for(const d of docs){const r=d.data(),card=document.createElement('article');card.className='item';linha(card,'Reserva',r.codigo||d.id);linha(card,'Origem',r.origem);linha(card,'Destino',r.destino);linha(card,'Data da viagem',r.dataViagem);linha(card,'Situação',r.status||r.situacao);lista.append(card)}}catch(e){msg.textContent='Consulta indisponível. Verifique permissões e vinculação das reservas ao motorista ('+(e.code||'erro')+').'}}auth.onAuthStateChanged(carregar);document.getElementById('recarregar').addEventListener('click',carregar);</script></body></html>
