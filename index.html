
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Porto Mobi | Transporte Executivo</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #080808;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    main {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 30px 24px;
      border: 1px solid #94732e;
      border-radius: 20px;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 240px;
      height: auto;
      margin: 0 auto 20px;
    }

    h1 {
      color: #f4cd60;
      font-size: 32px;
      margin: 10px 0;
    }

    p {
      line-height: 1.6;
    }

    .botao {
      display: block;
      background: #e5b740;
      color: #171100;
      text-decoration: none;
      font-weight: bold;
      padding: 18px;
      margin-top: 18px;
      border-radius: 12px;
    }

    .botao:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <main>

    <img
      src="./logo-porto-mobi.png"
      alt="Logotipo Porto Mobi Transporte Executivo"
      class="logo"
    >

    <h1>PORTO MOBI</h1>

    <p>Transporte Executivo</p>

    <p>Bem-vindo ao aplicativo do cliente.</p>

    <a class="botao" href="./login-cliente.html">
      Entrar na minha conta
    </a>

    <a class="botao" href="./cadastro-cliente.html">
      Fazer meu cadastro
    </a>

  </main>
</body>
</html>
